[workspace]
members = [
    "crates/sigma-core",
    "crates/sigma-app",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["Bhavuk Arora"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/bhavukarora/sigma"
edition = "2021"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
