<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <title>Sigma — High Performance Vector Design Engine</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='26' fill='%23121318' stroke='%232c2e3a' stroke-width='2'/%3E%3Cpolygon points='24,24 76,24 62,38 36,38' fill='%230ea5e9'/%3E%3Cpolygon points='76,24 44,50 62,38' fill='%238b5cf6'/%3E%3Cpolygon points='44,50 76,76 62,62' fill='%23f43f5e'/%3E%3Cpolygon points='24,76 36,62 62,62 76,76' fill='%2310b981'/%3E%3Cpolygon points='44,44 50,50 44,56 38,50' fill='%23ffffff'/%3E%3C/svg%3E">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #121318;
            user-select: none;
            -webkit-user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        #sigma_canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            pointer-events: none;
            transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .logo-container {
            width: 64px;
            height: 64px;
            filter: drop-shadow(0 12px 28px rgba(14, 165, 233, 0.28));
            animation: pulse-logo 2.4s ease-in-out infinite;
        }

        @keyframes pulse-logo {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 10px 24px rgba(14, 165, 233, 0.25)); }
            50% { transform: scale(1.05); filter: drop-shadow(0 16px 36px rgba(139, 92, 246, 0.4)); }
        }

        .brand-text {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #f5f5f7;
        }

        .pro-badge {
            font-size: 10px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 4px;
            background: #1e202a;
            border: 1px solid #0ea5e9;
            color: #38bdf8;
            letter-spacing: 0.5px;
        }

        .loading-subtext {
            font-size: 13px;
            color: #94a3b8;
            letter-spacing: 0.2px;
            margin-top: -8px;
        }

        .loading-bar {
            width: 160px;
            height: 3px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 999px;
            overflow: hidden;
            position: relative;
        }

        .loading-bar::after {
            content: '';
            position: absolute;
            left: -40%;
            width: 40%;
            height: 100%;
            background: linear-gradient(90deg, #0ea5e9, #8b5cf6, #f43f5e);
            border-radius: 999px;
            animation: shimmer 1.4s infinite ease-in-out;
        }

        @keyframes shimmer {
            0% { left: -40%; width: 30%; }
            50% { left: 40%; width: 50%; }
            100% { left: 100%; width: 30%; }
        }
    </style>
    <link data-trunk rel="rust" href="crates/sigma-app/Cargo.toml" />
</head>
<body>
    <div id="loading">
        <div class="logo-container">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="64" height="64">
                <rect width="100" height="100" rx="26" fill="#121318" stroke="#2c2e3a" stroke-width="2"/>
                <polygon points="24,24 76,24 62,38 36,38" fill="#0ea5e9"/>
                <polygon points="76,24 44,50 62,38" fill="#8b5cf6"/>
                <polygon points="44,50 76,76 62,62" fill="#f43f5e"/>
                <polygon points="24,76 36,62 62,62 76,76" fill="#10b981"/>
                <polygon points="44,44 50,50 44,56 38,50" fill="#ffffff"/>
            </svg>
        </div>
        <div class="brand-text">
            SIGMA <span class="pro-badge">PRO</span>
        </div>
        <div class="loading-subtext">Compiling WebAssembly Graphics Engine...</div>
        <div class="loading-bar"></div>
    </div>
    <canvas id="sigma_canvas"></canvas>
</body>
</html>
