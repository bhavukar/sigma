<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <title>Sigma — Vector Design Engine</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2318181b'/%3E%3Ctext x='50' y='68' font-size='56' font-family='-apple-system,sans-serif' font-weight='bold' text-anchor='middle' fill='%23ffffff'%3EΣ%3C/text%3E%3C/svg%3E">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #121215;
            user-select: none;
            -webkit-user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        #sigma_canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            pointer-events: none;
            transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .brand-text {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #f4f4f5;
        }

        .loading-subtext {
            font-size: 13px;
            color: #71717a;
            margin-top: -6px;
        }

        .loading-bar {
            width: 140px;
            height: 2px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 999px;
            overflow: hidden;
            position: relative;
        }

        .loading-bar::after {
            content: '';
            position: absolute;
            left: -40%;
            width: 40%;
            height: 100%;
            background: #38bdf8;
            border-radius: 999px;
            animation: shimmer 1.2s infinite ease-in-out;
        }

        @keyframes shimmer {
            0% { left: -40%; width: 30%; }
            50% { left: 40%; width: 45%; }
            100% { left: 100%; width: 30%; }
        }
    </style>
    <link data-trunk rel="rust" href="crates/sigma-app/Cargo.toml" />
</head>
<body>
    <div id="loading">
        <div class="brand-text">Sigma</div>
        <div class="loading-subtext">Loading engine...</div>
        <div class="loading-bar"></div>
    </div>
    <canvas id="sigma_canvas"></canvas>
</body>
</html>
